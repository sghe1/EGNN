model:
  in_node_nf: 9
  hidden_nf: 128
  out_node_nf: 4
  n_layers: 4
  attention: true

data:
  data_dir: "data/deforming_plate"
  preprocessed_dir: "egnn_preprocessed"
  split: "train"
  max_trajs: 1
  radius: 0.03

training:
  lr: 0.0001
  epochs: 500
  batch_size: 1
  device: "cpu"  # Use "cuda" if you have a CUDA-enabled GPU, "cpu" for macOS/CPU-only systems
  seed: 42

  visualization:
  start_step: 0       # Where to start the rollout
  rollout_steps: 50   # How many steps to simulate
  render_step: 40     # Which step to actually plot (must be < rollout_steps)
  
  # --- RESTORED OVERFIT CONFIG ---
  mode: "overfit"          # "standard" or "overfit"
  overfit_traj_ids: [0]     # Which trajectory to memorize
  overfit_time_ids: [0,1,2] # Which time steps to memorize